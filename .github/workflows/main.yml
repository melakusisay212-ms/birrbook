name: Build Birrbook Android APK

on:
  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-android-apk:
    name: Build release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find Expo project directory
        id: project
        shell: bash
        run: |
          set -e

          PACKAGE_JSON=$(find . \
            -type f \
            -name package.json \
            -not -path '*/node_modules/*' \
            -not -path './.git/*' \
            | head -n 1)

          if [ -z "$PACKAGE_JSON" ]; then
            echo "Error: package.json was not found."
            echo "Make sure the extracted Birrbook project files are committed to GitHub."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PACKAGE_JSON")

          if [ "$PROJECT_DIR" = "." ]; then
            PROJECT_DIR="."
          else
            PROJECT_DIR="${PROJECT_DIR#./}"
          fi

          echo "Found package.json at: $PACKAGE_JSON"
          echo "Expo project directory: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        run: npm install --global pnpm@9.12.0

      - name: Install JavaScript dependencies
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: pnpm install --no-frozen-lockfile

      - name: Generate Android native project
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: pnpm exec expo prebuild --platform android --no-install

      - name: Build release APK
        working-directory: ${{ steps.project.outputs.project_dir }}/android
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Locate generated APK
        id: apk
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -e

          APK_PATH=$(find android/app/build/outputs/apk/release \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK_PATH" ]; then
            echo "Error: APK was not generated."
            find android/app/build/outputs -type f 2>/dev/null || true
            exit 1
          fi

          echo "Generated APK: $APK_PATH"
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: Rename APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          cp "${{ steps.apk.outputs.apk_path }}" birrbook-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: birrbook-android-apk
          path: ${{ steps.project.outputs.project_dir }}/birrbook-release.apk
          if-no-files-found: error
          retention-days: 30
