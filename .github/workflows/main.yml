name: Birrbook CI and Mobile Build

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main

  workflow_dispatch:
    inputs:
      build_mobile:
        description: "Build Android and iOS with Expo EAS"
        required: true
        default: false
        type: boolean

concurrency:
  group: birrbook-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate and build web app
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        run: npm install --global pnpm@9.12.0

      - name: Show tool versions
        run: |
          node --version
          pnpm --version

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: TypeScript check
        run: pnpm check

      - name: Run tests
        run: pnpm test

      - name: Build web application
        run: pnpm exec expo export --platform web --output-dir dist-web

      - name: Verify web build
        run: test -f dist-web/index.html

      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: birrbook-web-build
          path: dist-web
          if-no-files-found: error
          retention-days: 14

  mobile_build:
    name: Build Android and iOS with Expo
    if: >
      github.event_name == 'workflow_dispatch' &&
      inputs.build_mobile == true
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        run: npm install --global pnpm@9.12.0

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Install Expo Application Services CLI
        run: npm install --global eas-cli

      - name: Check Expo authentication
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas whoami

      - name: Build Android and iOS
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas build --platform all --profile production --non-interactive
